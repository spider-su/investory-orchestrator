apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: investory-orchestrator
data:
  ORCHESTRATOR_SCHEMA: investory_orchestrator
  GITHUB_REPOSITORY: spider-su/investory
  GITHUB_APP_ID: "4494035"
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app/app.pem
  GITHUB_NOTIFY_LOGIN: spider-su
  GITHUB_PRIORITY_FIELD: Priority
  BASE_BRANCH: develop
  RELEASE_BRANCH: main
  APPROVED_PR_MERGE_METHOD: squash
  MAC_SSH_TARGET: alex@192.168.1.7
  MAC_SSH_KEY_PATH: /run/secrets/mac-runner/id_ed25519
  MAC_SSH_KNOWN_HOSTS: /run/secrets/mac-runner/known_hosts
  MAX_ACTIVE_TASKS: "1"
  MAX_CODEX_PROCESSES: "1"
  MAX_BUILDS: "1"
  QUEUE_POLL_SECONDS: "20"
  RUNNER_HEALTH_CHECK_SECONDS: "60"
  WORKER_HEARTBEAT_SECONDS: "20"
  READY_ISSUE_LABEL: ready_to_develop
  SLACK_CHANNEL_ID: C0C7CFQP6LB
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-investory-orchestrator-to-postgres
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: investory-orchestrator
      ports:
        - protocol: TCP
          port: 5432

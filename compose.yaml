services:
  orchestrator:
    build: .
    env_file:
      - .env
    environment:
      DOCKER_CONFIG: /tmp/docker-config

    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
      - ${HOST_WORKSPACES_DIR:-./workspaces}:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock

    secrets:
      - github-app-key

secrets:
  github-app-key:
    file: ./secrets/github-app.pem

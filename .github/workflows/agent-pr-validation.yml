name: Agent PR validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run project validation
        run: sh scripts/ci-validate.sh

  postgres-runner-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator_test
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://orchestrator:orchestrator-test-only@127.0.0.1:5432/orchestrator_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create isolated test schema prefix
        run: >-
          python -c "import datetime,secrets; print('TEST_POSTGRES_SCHEMA=orchestrator_test_'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d')+'_'+secrets.token_hex(4))"
          >> "$GITHUB_ENV"

      - name: Run SQLite and PostgreSQL runner-job tests
        run: python -m unittest discover -s tests -p 'test_runner_job_store.py' -v

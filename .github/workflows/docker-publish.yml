name: Docker Build and Publish

on:
  workflow_run:
    workflows:
      - Agent PR validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  docker-k3s:
    name: Build and publish k3s runtime image
    needs: manual-validation
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.manual-validation.result == 'success' || needs.manual-validation.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify Docker build inputs
        run: |
          test -f Dockerfile
          test -f requirements.txt
          test -f app/__main__.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract k3s image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: aserobaba/orchestrator
          tags: |
            type=raw,value=k3s-latest,enable={{is_default_branch}}
            type=raw,value=k3s-sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build and push k3s runtime image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: k3s
          build-args: ORCHESTRATOR_BUILD_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator-k3s
          cache-to: type=gha,scope=orchestrator-k3s,mode=max
      - name: Scan published k3s runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate k3s runtime SBOM
        uses: anchore/sbom-action@v0
        with:
          image: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          artifact-name: investory-orchestrator-k3s-image.spdx.json
          output-file: investory-orchestrator-k3s.spdx.json
      - name: Upload k3s runtime SBOM
        uses: actions/upload-artifact@v7
        with:
          name: investory-orchestrator-k3s-image-sbom
          path: investory-orchestrator-k3s.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize published k3s image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published orchestrator k3s runtime image'
            echo
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo "docker.io/aserobaba/orchestrator@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-full:
    name: Build and publish full tooling image
    needs: manual-validation
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.manual-validation.result == 'success' || needs.manual-validation.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify Docker build inputs
        run: |
          test -f Dockerfile
          test -f requirements.txt
          test -f app/__main__.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract full image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: aserobaba/orchestrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build and push full tooling image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: full
          build-args: ORCHESTRATOR_BUILD_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator-full
          cache-to: type=gha,scope=orchestrator-full,mode=max
      - name: Scan published full image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate full image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          artifact-name: investory-orchestrator-image.spdx.json
          output-file: investory-orchestrator.spdx.json
      - name: Upload full image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: investory-orchestrator-image-sbom
          path: investory-orchestrator.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize published full image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published orchestrator full tooling image'
            echo
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo "docker.io/aserobaba/orchestrator@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

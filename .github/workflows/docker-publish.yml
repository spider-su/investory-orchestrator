name: Docker Build and Publish

on:
  workflow_run:
    workflows:
      - Agent PR validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python for manual publish validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies for manual publish validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m pip install -r requirements.txt

      - name: Run tests before manual publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: aserobaba/orchestrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker build inputs
        run: |
          test -f Dockerfile
          test -f requirements.txt
          test -f app/__main__.py

      - name: Build and push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summarize published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published orchestrator image'
            echo
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo "docker.io/aserobaba/orchestrator@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: aserobaba/orchestrator@${{ steps.image.outputs.digest }}
          artifact-name: investory-orchestrator-image.spdx.json
          output-file: investory-orchestrator.spdx.json

      - name: Upload image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: investory-orchestrator-image-sbom
          path: investory-orchestrator.spdx.json
          if-no-files-found: error
          retention-days: 7
